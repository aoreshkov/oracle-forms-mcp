version: 2
# Ecosystem ownership is split with renovate.json to avoid competing PRs:
# Dependabot owns docker + github-actions; Renovate owns gradle + gradle-wrapper.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init/analyze/upload-sarif are separate Dependabot dependencies, but CodeQL
      # errors out when they run at different versions ("Loaded a configuration file
      # for version X, but running version Y"). Group them so they bump in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # Keeps the digest-pinned eclipse-temurin base image fresh (JRE CVE patches).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
