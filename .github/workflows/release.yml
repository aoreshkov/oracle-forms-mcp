name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub Release (server zip + MCPB bundle)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      # Consumed by publish-mcp-registry: the MCP Registry requires `fileSha256` on MCPB
      # packages, and clients verify it before installing.
      mcpb_sha256: ${{ steps.mcpb.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches project version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "^version=${VERSION}$" gradle.properties || {
            echo "Tag ${GITHUB_REF_NAME} does not match version in gradle.properties"; exit 1; }
          jq -e --arg v "$VERSION" '.version == $v' server.json > /dev/null || {
            echo "Tag ${GITHUB_REF_NAME} does not match version in server.json"; exit 1; }
          # The MCP `Implementation` version is baked from gradle.properties at build time
          # (see ServerVersion / generateVersionResource), so the check above covers it. The
          # MCPB manifest version likewise comes from project.version via generateMcpbManifest.

          # Registry metadata invariants, checked here so a bad listing fails before anything
          # is published (registry entries are immutable once accepted).
          jq -e '(.title | length) > 0 and (.title | length) <= 100' server.json > /dev/null || {
            echo "server.json .title must be present and <= 100 characters"; exit 1; }
          jq -e '(.description | length) <= 100' server.json > /dev/null || {
            echo "server.json .description exceeds the registry's 100-character limit"; exit 1; }
          # Icon URLs must be pinned to a version tag, never to a branch: a mutable ref would
          # silently repoint the icons of already-published (immutable) versions. The publish
          # job rewrites the tag itself, so this only asserts the *shape*.
          jq -e 'all(.icons[].src; test("/v[0-9]+[.][0-9]+[.][0-9]+[^/]*/assets/"))' server.json > /dev/null || {
            echo "server.json .icons[].src must be pinned to a vX.Y.Z tag, not a branch"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build and test
        run: ./gradlew build

      # packageMcpb consumes the installDist tree, so it must run before the zip step below
      # renames that directory.
      - name: Build server distribution and MCPB bundle
        run: ./gradlew :server:installDist :server:packageMcpb

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Validate MCPB manifest
        # Schema-checks the generated manifest against the MCPB spec. Gradle still builds the
        # archive itself (a .mcpb is a plain zip); the CLI is used only as a validator.
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate server/build/mcpb-manifest/manifest.json

      - name: Hash MCPB bundle
        id: mcpb
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="server/build/mcpb/oracle-forms-mcp-${VERSION}.mcpb"
          test -f "$BUNDLE" || { echo "Missing ${BUNDLE}"; exit 1; }
          echo "sha256=$(sha256sum "$BUNDLE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Package distribution
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd server/build/install
          mv server "oracle-forms-mcp-server-${VERSION}"
          zip -qr "oracle-forms-mcp-server-${VERSION}.zip" "oracle-forms-mcp-server-${VERSION}"
          # Published alongside the zip because the Claude Code plugin's launcher fetches it and
          # refuses to install a distribution that doesn't match. Keep the sha256sum format
          # ("<hex>  <file>") — the launcher reads the first whitespace-separated token.
          sha256sum "oracle-forms-mcp-server-${VERSION}.zip" \
            > "oracle-forms-mcp-server-${VERSION}.zip.sha256"

      - name: Attest build provenance (release artifacts)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            server/build/install/oracle-forms-mcp-server-*.zip
            server/build/mcpb/oracle-forms-mcp-*.mcpb

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            server/build/install/oracle-forms-mcp-server-*.zip
            server/build/install/oracle-forms-mcp-server-*.zip.sha256
            server/build/mcpb/oracle-forms-mcp-*.mcpb
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Build server distribution
        run: ./gradlew :server:installDist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/oracle-forms-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The MCP registry validates OCI packages via this annotation.
          annotations: |
            io.modelcontextprotocol.server.name=io.github.aoreshkov/oracle-forms-mcp

      - name: Attest build provenance (Docker image)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/oracle-forms-mcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-mcp-registry:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [github-release, docker]
    permissions:
      id-token: write # GitHub OIDC login to the registry — no stored secret
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mcp-publisher
        env:
          # Pinned + checksum-verified: this binary runs in the job holding the
          # id-token:write registry-publish credential. Bump deliberately — take the
          # new SHA-256 from the release's registry_<version>_checksums.txt asset.
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Sync server.json with the tag and add the MCPB package
        env:
          MCPB_SHA256: ${{ needs.github-release.outputs.mcpb_sha256 }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          test -n "$MCPB_SHA256" || { echo "Missing MCPB sha256 from the release job"; exit 1; }
          # Packages are matched by registryType, never by index, so adding one can't silently
          # rewrite another. The MCPB entry is built here rather than committed because
          # `fileSha256` is a strict 64-hex pattern with no honest placeholder value.
          jq --arg v "$VERSION" --arg tag "$GITHUB_REF_NAME" --arg sha "$MCPB_SHA256" '
              .version = $v
            | .icons = [.icons[] | .src |= sub("/v[^/]+/assets/"; "/" + $tag + "/assets/")]
            | .packages = [
                (.packages[] | if .registryType == "oci"
                   then .identifier = "ghcr.io/aoreshkov/oracle-forms-mcp:" + $v
                   else . end),
                {
                  registryType: "mcpb",
                  identifier: ("https://github.com/aoreshkov/oracle-forms-mcp/releases/download/"
                               + $tag + "/oracle-forms-mcp-" + $v + ".mcpb"),
                  fileSha256: $sha,
                  version: $v,
                  transport: { type: "stdio" }
                }
              ]' server.json > server.json.tmp && mv server.json.tmp server.json
          cat server.json

      - name: Login and publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
