name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # Includes Gradle wrapper validation and build caching.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build, test and check API compatibility
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7

  claude-code-plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    env:
      # 2.1.281 or later: earlier `validate` skips the checks on the plugin's MCP servers.
      # Pinned so a new Claude Code release cannot change what `--strict` accepts without a
      # reviewed commit. Bump it deliberately.
      CLAUDE_CODE_VERSION: 2.1.294
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version check below compares against the last release tag.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      # The plugin is consumed straight from the repository by `/plugin marketplace add`, so a
      # broken manifest or launcher ships the moment it lands on main — there is no build step
      # between here and the user. These checks are that build step.
      - name: Validate the marketplace and plugin manifests
        run: |
          MARKET=.claude-plugin/marketplace.json
          PLUGIN=plugins/oracle-forms/.claude-plugin/plugin.json
          jq -e '.name and .owner.name and (.plugins | length > 0)' "$MARKET" > /dev/null
          # Every marketplace entry must point at a directory that actually holds a plugin.
          for src in $(jq -r '.plugins[].source' "$MARKET"); do
            test -f "${src}/.claude-plugin/plugin.json" || {
              echo "Marketplace source ${src} has no .claude-plugin/plugin.json"; exit 1; }
          done
          jq -e '.name and .version and .userConfig.forms_dir.required == true' "$PLUGIN" > /dev/null
          # The MCP entry must keep resolving the launcher through ${CLAUDE_PLUGIN_ROOT}: a bare
          # relative path would resolve against the session's working directory instead.
          jq -e '.mcpServers["oracle-forms"].args[0]
                 | startswith("${CLAUDE_PLUGIN_ROOT}/")' plugins/oracle-forms/.mcp.json > /dev/null
          test -f "$(jq -r '.mcpServers["oracle-forms"].args[0]' plugins/oracle-forms/.mcp.json \
                     | sed 's|${CLAUDE_PLUGIN_ROOT}|plugins/oracle-forms|')"

      # The skills ship by the same route as the manifests — no build step between a commit and a
      # user's install — and a skill whose frontmatter does not parse is simply never offered.
      - name: Validate the plugin skills
        run: |
          shopt -s nullglob
          skills=(plugins/oracle-forms/skills/*/SKILL.md)
          test ${#skills[@]} -gt 0 || { echo "No SKILL.md under plugins/oracle-forms/skills"; exit 1; }
          for skill in "${skills[@]}"; do
            head -n 1 "$skill" | grep -qx -- '---' || {
              echo "${skill}: must start with YAML frontmatter"; exit 1; }
            name=$(sed -n '2,/^---$/p' "$skill" | sed -n 's/^name: *//p')
            sed -n '2,/^---$/p' "$skill" | grep -qE '^description: .+' || {
              echo "${skill}: frontmatter needs a description — it is what decides when the skill loads"
              exit 1; }
            # The directory name is the fallback invocation name; keeping them equal means the
            # documented `/oracle-forms:<name>` cannot drift from the directory users see.
            test "$name" = "$(basename "$(dirname "$skill")")" || {
              echo "${skill}: frontmatter name '${name}' must match its directory"; exit 1; }
          done

      # The launcher runs in single-file source mode on the user's machine, where a compile error
      # surfaces only as an MCP server that fails to connect.
      - name: Compile the plugin launcher
        run: javac -Xlint:all -d "${RUNNER_TEMP}/launcher" plugins/oracle-forms/launcher/*.java

      # Claude Code updates an installed plugin only when plugin.json's `version` changes, so
      # a change under the plugin without a bump never reaches anyone who already has it. That
      # covers users of this repository's marketplace, and of any marketplace that pins a
      # release of it. Bump once per release cycle, in the first change after a tag. README.md
      # is left out: Claude Code never loads it.
      - name: Plugin version moves with the plugin
        run: |
          dir=plugins/oracle-forms
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null) || {
            echo "No release tag yet: nothing to compare against"; exit 0; }
          paths=("$dir" ":(exclude)${dir}/README.md")
          if git diff --quiet "$tag" HEAD -- "${paths[@]}"; then
            echo "OK: ${dir}/ unchanged since ${tag}"; exit 0
          fi
          was=$(git show "${tag}:${dir}/.claude-plugin/plugin.json" | jq -r .version)
          now=$(jq -r .version "${dir}/.claude-plugin/plugin.json")
          test "$now" != "$was" || {
            echo "::error file=${dir}/.claude-plugin/plugin.json::${dir}/ changed since ${tag}, but its version is still ${now}. Bump it, or users who have ${now} never get the change."
            git diff --stat "$tag" HEAD -- "${paths[@]}"
            exit 1; }
          echo "OK: ${dir}/ changed since ${tag}, and its version moved ${was} -> ${now}"

      # The checks above cover this repository's own invariants; `validate` covers Claude
      # Code's, including the MCP server entry and every ${user_config.*} reference in it.
      # ubuntu-latest ships Node, so no setup-node step is needed.
      - name: Install Claude Code
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: claude plugin validate --strict
        run: |
          claude plugin validate . --strict
          claude plugin validate ./plugins/oracle-forms --strict

  docker-smoke:
    name: Docker volume write-rights smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The Dockerfile is runtime-only; it COPYs the dist rather than building it.
      - name: Build server distribution
        run: ./gradlew :server:installDist

      - name: Build image
        run: docker build -t oracle-forms-mcp:smoke .

      # Guards the Dockerfile ownership fix: with an ANONYMOUS volume at the declared
      # VOLUME path, the mount point must be owned by the runtime user (uid 10001) so
      # the non-root process can create the cache + annotation store. If the
      # mkdir/chown-before-VOLUME ordering regresses, Docker mounts the volume
      # root-owned and the writes below fail with AccessDenied — exactly the runtime
      # failure this reproduces. Runs as the image's default user (no --user override)
      # and lets the VOLUME instruction auto-create the anonymous volume, as a plain
      # `docker run` would.
      - name: Non-root user can write the annotation store on an anonymous volume
        run: |
          docker run --rm --entrypoint /bin/sh oracle-forms-mcp:smoke -eu -c '
            test "$(id -u)" = "10001" || { echo "not running as uid 10001: $(id -u)"; exit 1; }
            owner="$(stat -c "%u" /home/mcp/.cache)"
            test "$owner" = "10001" || { echo "cache mount point owned by uid $owner, expected 10001"; exit 1; }
            f=/home/mcp/.cache/oracle-forms-mcp/annotations/smoke.fmb.json
            mkdir -p "$(dirname "$f")"
            printf "{}" > "$f"
            test -s "$f" || { echo "annotation file not written"; exit 1; }
            echo "OK: uid 10001 wrote $f on the anonymous volume"
          '
